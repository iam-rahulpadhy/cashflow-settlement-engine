# Profile: h2test
# Activates H2 in-memory DB so the TestRunner can run without PostgreSQL.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2test
spring:
  datasource:
    url: jdbc:h2:mem:cashflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # create-drop wipes and recreates the schema on each run -- perfect for a test harness
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

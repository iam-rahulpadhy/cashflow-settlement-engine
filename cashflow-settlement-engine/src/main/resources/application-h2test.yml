# Profile: h2test — run without PostgreSQL
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2test
spring:
  datasource:
    url: jdbc:h2:mem:cashflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

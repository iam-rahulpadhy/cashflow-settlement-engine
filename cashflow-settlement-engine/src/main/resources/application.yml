spring:
  application:
    name: cashflow-settlement-engine


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cashflow_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 50
      thread-name-prefix: settlement-async-

server:
  port: 8080
